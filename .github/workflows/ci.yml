name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Pre-existing ESLint debt (~270 errors); gate stays soft until burn-down.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit tests
        run: npm run test:unit
      - name: Status unions vs DB CHECKs
        run: node --import tsx --test src/lib/__tests__/statusConstraints.test.ts
      - name: Database types committed
        run: |
          test -f src/lib/database.types.ts
          grep -q "export type Database" src/lib/database.types.ts
          # Fail if types file is empty or missing Tables (must be regenerated after migrations)
          grep -q "Tables:" src/lib/database.types.ts
      - name: Knip (dependencies)
        run: npm run knip -- --include dependencies
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholderplaceholderplaceholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-placeholderxx
          HACKATHON_COMPETE_SECRET: ci-hackathon-compete-secret
          NEXT_TELEMETRY_DISABLED: "1"

  # Optional: set repo secret SUPABASE_DB_URL to run. Job-level `if: secrets.*`
  # is invalid in GitHub Actions — gate inside the job instead.
  marketing-rls:
    name: Marketing RLS smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check SUPABASE_DB_URL secret
        id: gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_DB_URL not set — skipping marketing RLS smoke."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - if: steps.gate.outputs.run == 'true'
        name: Run marketing RLS SQL
        run: npm run test:sql:marketing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
